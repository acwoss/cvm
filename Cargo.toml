[workspace]
resolver = "2"
members = ["cvm-core", "cvm-ui/src-tauri"]
default-members = ["."]

[package]
name = "cvm"
# `cvm` e `cvm-ui` são publicados juntos sob a mesma tag de release (ver
# .github/workflows/release.yml) - ao dar bump aqui, também dar bump em
# cvm-ui/src-tauri/Cargo.toml, cvm-ui/src-tauri/tauri.conf.json e
# cvm-ui/package.json para o mesmo valor.
version = "0.5.5"
edition = "2021"
description = "Claude Virtualenv Manager - isolate and share Claude Code configuration environments"
license = "MIT"
authors = ["cvm contributors"]
repository = "https://github.com/acwoss/cvm"
readme = "README.md"
keywords = ["claude", "cli", "environment", "virtualenv"]
categories = ["command-line-utilities"]

[[bin]]
name = "cvm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
dialoguer = "0.11"
self-replace = "1.5"
semver = "1"
cvm-core = { path = "cvm-core" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.release.package.cvm-ui]
opt-level = 3
codegen-units = 16
