[workspace]
resolver = "2"
members = ["cvm-core"]
default-members = ["."]

[package]
name = "cvm"
version = "0.4.0"
edition = "2021"
description = "Claude Virtualenv Manager - isolate and share Claude Code configuration environments"
license = "MIT"
authors = ["cvm contributors"]
repository = "https://github.com/acwoss/cvm"
readme = "README.md"
keywords = ["claude", "cli", "environment", "virtualenv"]
categories = ["command-line-utilities"]

[[bin]]
name = "cvm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
dialoguer = "0.11"
self-replace = "1.5"
cvm-core = { path = "cvm-core" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
