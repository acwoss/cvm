[package]
name = "cvm-core"
version = "0.1.0"
edition = "2021"
description = "Shared environment/config logic for cvm and its UI"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
dirs = "5"
self-replace = "1.5"
semver = "1"

[dev-dependencies]
tempfile = "3"
